# SPDX-License-Identifier: MIT
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test native processors
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-native.ps1
      - name: Test managed components with generated payload hash
        shell: pwsh
        run: |
          [xml]$props = Get-Content .\artifacts\native\webrtc-apm.props -Raw
          $hash = [string]$props.Project.PropertyGroup.WebRtcApmPluginSha256
          dotnet test .\NoiseCancellingStack.slnx --configuration Release --nologo "-p:WebRtcApmPluginSha256=$hash"
